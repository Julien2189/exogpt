<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0 ;
            padding: 0;
            box-sizing: border-box;
        }
     body{
        min-height: 100vh;
        width: 100%;
        display: flex ;
        flex-direction: column;
        justify-content: center;
        align-items: center;
     }
        .modal {
    display: flex;
    position: fixed;
    justify-content: center;
    align-items: center;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6);
    z-index: 1000;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition: opacity 0.3s ease, visibility 0.3s ease;
}
.fermer {
    position: absolute;
    top: 10px;
    right: 10px;
}
        .modal-content {
            display: flex;
            flex-direction: column;
            margin: 20px;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid black;
            width: 300px;
            height: 300px;
            background: wheat;
            border-radius: 12px;
            position: relative;
        }
        .modal.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}
    </style>
</head>
<body>
      <button id="ouvrirModal">Ajouter un produit</button>

<ul id="listeProduits"></ul>
<p>Total : <span id="total">0</span> €</p>

<div id="modalProduit" class="modal">
  <div class="modal-content">
    <button id="fermer" class="fermer">X</button>
    <h2>Nouveau produit</h2>

    <input type="text" id="nomProduit" placeholder="Nom du produit">
    <input type="number" id="prixProduit" placeholder="Prix du produit">

    <p id="erreur"></p>

    <button id="ajouterProduit">Ajouter</button>
    <button id="annuler">Annuler</button>
  </div>
</div>
<script>
    const ouvrirModal = document.getElementById('ouvrirModal') ;
    const modalProduit = document.getElementById('modalProduit') ;
    const fermer = document.getElementById('fermer') ;
    ouvrirModal.addEventListener(('click'),() =>{
        modalProduit.classList.toggle('active') ;
    }) ;
    fermer.addEventListener(('click'), () =>{
        modalProduit.classList.remove('active') ;
    })
</script>
</body>
</html>
